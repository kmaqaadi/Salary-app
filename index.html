<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b16">

<title>رصد</title>

<link rel="apple-touch-icon" href="icon.png.PNG">
<link rel="icon" href="icon.png.PNG">
<meta name="apple-mobile-web-app-title" content="رصد">

<style>
:root{
  --bg:#070913;
  --text:#f7f8ff;
  --muted:#8f96ae;
  --blue:#5b8cff;
  --cyan:#40e0ff;
  --violet:#985cff;
  --green:#45e6a3;
  --red:#ff6577;
  --line:rgba(255,255,255,.07);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 85% 0%,rgba(91,140,255,.18),transparent 35%),
    radial-gradient(circle at 10% 35%,rgba(152,92,255,.12),transparent 32%),
    var(--bg);
  color:var(--text);
}

button,input{
  font:inherit;
}

.app{
  max-width:720px;
  margin:auto;
  padding:18px 14px 110px;
}

/* HEADER */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:44px;
  height:44px;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 10px 28px rgba(91,140,255,.25);
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.brand h1{
  margin:0;
  font-size:19px;
}

.brand small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.status{
  color:var(--green);
  background:rgba(69,230,163,.08);
  border:1px solid rgba(69,230,163,.15);
  border-radius:100px;
  padding:7px 9px;
  font-size:11px;
}

/* HERO */

.hero{
  position:relative;
  overflow:hidden;
  border-radius:23px;
  padding:14px 16px;
  background:
    linear-gradient(
      135deg,
      rgba(91,140,255,.21),
      rgba(152,92,255,.12) 48%,
      rgba(255,94,168,.08)
    );
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 18px 45px rgba(0,0,0,.22);
}

.hero:before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  left:-90px;
  top:-115px;
  background:rgba(64,224,255,.14);
  filter:blur(20px);
}

.hero-grid{
  display:grid;
  grid-template-columns:1fr 82px;
  gap:10px;
  align-items:center;
  position:relative;
  z-index:1;
}

.hero-label{
  color:#b9bfd1;
  font-size:11px;
}

.hero-money{
  margin:5px 0;
  line-height:1;
  white-space:nowrap;
}

#remainingNumber{
  font-size:30px;
  font-weight:900;
}

.currency{
  color:#bec4d8;
  font-size:12px;
  font-weight:600;
}

.hero-sub{
  color:#939bb5;
  font-size:10px;
}

.orbit{
  --angle:0deg;
  width:78px;
  height:78px;
  border-radius:50%;
  padding:6px;
  background:
    conic-gradient(
      var(--cyan) 0deg,
      var(--blue) var(--angle),
      rgba(255,255,255,.07) var(--angle),
      rgba(255,255,255,.07) 360deg
    );
}

.orbit-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  background:#0c0f1c;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  border:1px solid rgba(255,255,255,.06);
}

.orbit-inner strong{
  font-size:14px;
}

.orbit-inner span{
  color:var(--muted);
  font-size:9px;
  margin-top:2px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:8px;
}

.stat{
  padding:8px 10px;
  background:rgba(0,0,0,.15);
  border:1px solid rgba(255,255,255,.06);
  border-radius:13px;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-bottom:3px;
}

.stat strong{
  font-size:12px;
}

/* GENERAL */

.page{
  display:none;
  margin-top:14px;
}

.page.active{
  display:block;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin:18px 3px 9px;
}

.section-title h2{
  margin:0;
  font-size:16px;
}

.section-title span{
  color:var(--muted);
  font-size:10px;
}

.card{
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.025)
    );
  border:1px solid var(--line);
  border-radius:21px;
  padding:14px;
  margin-bottom:10px;
}

.field label{
  display:block;
  color:#a1a8bf;
  font-size:11px;
  margin:0 4px 6px;
}

.input-wrap{
  position:relative;
}

.input-wrap input{
  width:100%;
  height:48px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.07);
  background:#0c0f1b;
  color:white;
  padding:0 14px 0 55px;
  outline:none;
  font-size:16px;
}

.input-wrap input:focus{
  border-color:rgba(91,140,255,.65);
  box-shadow:0 0 0 3px rgba(91,140,255,.09);
}

.unit{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  color:#707894;
  font-size:11px;
}

/* DYNAMIC ITEMS */

.dynamic-list{
  display:flex;
  flex-direction:column;
}

.dynamic-row{
  display:grid;
  grid-template-columns:27px minmax(0,1fr);
  gap:7px;
  padding:11px 0;
  border-bottom:1px solid var(--line);
}

.dynamic-row.compact{
  padding:7px 0;
}

.dynamic-row:last-child{
  border-bottom:0;
}

.drag{
  width:27px;
  height:40px;
  border:0;
  background:transparent;
  color:#66708d;
  font-size:18px;
  padding:0;
  cursor:grab;
}

.item-body{
  min-width:0;
}

.item-top{
  display:flex;
  align-items:center;
  gap:7px;
}

.item-name{
  min-width:0;
  flex:1;
  border:0;
  background:transparent;
  color:white;
  font-size:13px;
  font-weight:700;
  padding:3px 0;
  outline:none;
}

.item-name:not([readonly]){
  border-bottom:1px dashed rgba(255,255,255,.12);
}

.item-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:5px;
}

.item-amount{
  color:var(--cyan);
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
}

.controls{
  display:flex;
  align-items:center;
  gap:5px;
}

.mode{
  height:34px;
  min-width:48px;
  border:1px solid var(--line);
  background:#0c0f1b;
  color:#aab2ca;
  border-radius:11px;
  font-size:10px;
  font-weight:700;
  padding:0 8px;
}

.value-wrap{
  position:relative;
  width:73px;
}

.value-wrap input{
  width:100%;
  height:34px;
  border-radius:11px;
  border:1px solid var(--line);
  background:#0c0f1b;
  color:white;
  text-align:center;
  padding:0 21px 0 5px;
  outline:none;
  font-size:13px;
}

.value-wrap span{
  position:absolute;
  left:7px;
  top:50%;
  transform:translateY(-50%);
  color:#707894;
  font-size:9px;
  pointer-events:none;
}

.delete{
  width:32px;
  height:34px;
  border:0;
  border-radius:11px;
  color:var(--red);
  background:rgba(255,101,119,.09);
  font-size:17px;
}

.add{
  width:100%;
